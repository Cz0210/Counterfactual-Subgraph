gnn:
  backbone: gatv2
  num_layers: 5
  hidden_dim: 256
  dropout: 0.2
  pooling: mean
  readout_layers: 2
  normalization: batch_norm
  residual: true
training:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.00001
  max_epochs: 200
  early_stopping_patience: 20
  batch_size: 64
  primary_seed: 7
  selection_metric: macro_f1
  class_weighted_loss: true
  weighted_sampler: false
  gradient_clip_norm: 5.0
calibration:
  method: temperature_scaling
  split: validation
  max_iter: 100
