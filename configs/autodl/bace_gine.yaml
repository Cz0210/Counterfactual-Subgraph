runtime:
  environment: autodl
  device: cuda
  dry_run: false
  num_workers: 4
paths:
  data_root: data
  output_root: outputs/autodl
  cache_root: .cache/autodl
  model_root: null
model:
  model_path: null
  model_name_or_path: null
  tokenizer_path: null
run:
  notes: autodl_bace_task_specific_frozen_gnn
autodl:
  dataset: bace
  oracle_backend: gnn
  classifier_type: gnn
  rf_oracle_used: false
  backbone: gine
  source_label: 1
  num_classes: 2
  split_root_env: BACE_SPLIT_ROOT
  max_gpus: 2
  run_tastemolnet: false
  control_root_env: AUTODL_CONTROL_ROOT
  python_env: AUTODL_PYTHON
  calibration:
    stage: B4_GNN_CALIBRATED
    predecessor: B3_GNN_FULL
    split: validation
    max_iter: 100
  oracle_smoke:
    stage: B5_ORACLE_SMOKE
    predecessor: B4_GNN_CALIBRATED
    split: calibration
    source_label: 1
    correctly_predicted_source_count: 16
    max_deletions_per_parent: 4
    require_connected_deletion_per_parent: true
    expected_num_classes: 2
    test_loaded: false
  downstream_route:
    launcher: scripts/autodl/run_bace_frozen_gnn_stage.sh
    driver: scripts/autodl/bace_frozen_gnn_route.py
    b6_execution_mode: gnn_scoring_preflight_not_ppo
    b6_stage_status: BLOCKED
    b6_blocker: BLOCKED_MISSING_GNN_PPO_INTEGRATION
    b6_secondary_blocker: BLOCKED_NO_GNN_CLEAN_BACE_POLICY_INITIALIZATION
    b6_ppo_training_performed: false
    b6_downstream_release_authorized: false
    scientific_blocked_exit_code: 78
    b7_blocker: BLOCKED_MISSING_GNN_PPO_INTEGRATION
    b8_blocker: BLOCKED_MISSING_GNN_CANDIDATE_SCORER_INTEGRATION
    b9_blocker: BLOCKED_MISSING_GNN_HIGHTEMP_POOL_INTEGRATION
    b10_blocker: BLOCKED_MISSING_GNN_POOL_MERGE_INTEGRATION
    b11_blocker: BLOCKED_MISSING_GNN_CROSS_PARENT_VERIFICATION_INTEGRATION
    b12_blocker: BLOCKED_MISSING_GNN_SELECTOR_MATRIX_CONTRACT
    b13_blocker: BLOCKED_MISSING_GNN_HELDOUT_EVALUATION_INTEGRATION
    b14_blocker: BLOCKED_MISSING_GNN_FINAL_FREEZE_INTEGRATION
