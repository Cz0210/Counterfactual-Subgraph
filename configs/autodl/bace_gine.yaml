runtime:
  environment: autodl
  device: cuda
  dry_run: false
  num_workers: 4
paths:
  data_root: data
  output_root: outputs/autodl
  cache_root: .cache/autodl
  model_root: null
model:
  model_path: null
  model_name_or_path: null
  tokenizer_path: null
run:
  notes: autodl_bace_task_specific_frozen_gnn
autodl:
  dataset: bace
  oracle_backend: gnn
  classifier_type: gnn
  rf_oracle_used: false
  backbone: gine
  source_label: 1
  num_classes: 2
  split_root_env: BACE_SPLIT_ROOT
  max_gpus: 2
  run_tastemolnet: false
