runtime:
  environment: autodl
  device: cuda
  dry_run: false
  num_workers: 4
paths:
  data_root: data
  output_root: outputs/autodl
  cache_root: .cache/autodl
  model_root: null
model:
  model_path: null
  model_name_or_path: null
  tokenizer_path: null
run:
  notes: autodl_tastemolnet_foundation_ready_not_run
autodl:
  dataset: tastemolnet
  oracle_backend: gnn
  classifier_type: gnn
  rf_oracle_used: false
  backbone: gine
  source_label: 1
  num_classes: 3
  split_root_env: TASTEMOLNET_SPLIT_ROOT
  max_gpus: 2
  run_tastemolnet: false
  heavy_training_authorization_env: RUN_TASTEMOLNET
